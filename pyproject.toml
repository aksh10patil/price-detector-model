[project]
name = "price-prediction"
version = "0.1.0"
description = "The Price is Right: Capstone Project (Week 6 & Week 7) - Predicting product prices using traditional ML, Frontier LLMs, and Open-Source QLoRA Fine-Tuning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.42.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "litellm>=1.30.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "google-genai>=1.0.0",
    "groq>=0.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "huggingface-hub>=0.21.0",
    "wandb>=0.16.0",
    "ipykernel>=6.25.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
